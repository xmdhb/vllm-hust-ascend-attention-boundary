[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-op01-ascend-attention-boundary"
dynamic = ["version"]
description = "OP01 Ascend attention boundary search optimization"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
op01_ascend_attention_boundary = "vllm_hust_op01_ascend_attention_boundary.plugin:register"

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.op01-ascend-attention-boundary" = "vllm_hust_op01_ascend_attention_boundary.manifests"

[tool.setuptools.dynamic]
version = {attr = "vllm_hust_op01_ascend_attention_boundary._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_hust_op01_ascend_attention_boundary = ["manifests/*.json"]
